<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
  <div style="max-width: 600px; margin: 0 auto; border: 1px solid #ddd; padding: 20px; border-radius: 10px;">
    <h2 style="color: #0056b3;">Request Submitted Successfully</h2>
    <p>Hello {{name}},</p>
    <p>Your request has been submitted and is now awaiting approval.</p>
    <div style="background: #f9f9f9; padding: 15px; border-left: 5px solid #0056b3; margin: 20px 0;">
      <strong>Tracking ID:</strong> {{trackingId}}<br>
      <strong>Category:</strong> {{category}}<br>
      <strong>Submitted On:</strong> {{date}}
    </div>
    <p>You can track the status of your request in the User Dashboard.</p>
    <p>Regards,<br>IT & Admin Support Team</p>
  </div>
</body>
</html>
