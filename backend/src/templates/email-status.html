<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
  <div style="max-width: 600px; margin: 0 auto; border: 1px solid #ddd; padding: 20px; border-radius: 10px;">
    <h2 style="color: #28a745;">Request Status Update</h2>
    <p>Hello {{name}},</p>
    <p>There has been an update to your request.</p>
    <div style="background: #f9f9f9; padding: 15px; border-left: 5px solid #28a745; margin: 20px 0;">
      <strong>Tracking ID:</strong> {{trackingId}}<br>
      <strong>New Status:</strong> {{status}}<br>
      <strong>Comments:</strong> {{comments}}
    </div>
    <p>You can view the full details in your dashboard.</p>
    <p>Regards,<br>Workflow Engine</p>
  </div>
</body>
</html>
